# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# Versions. Minecraft and Fabric lookups: https://fabricmc.net/develop
mc=26.3
fabric_loader=0.20.1
fabric_api=0.164.0+26.3
loom_plugin=1.19.2

sodium=mc26.3-0.9.3-beta.1-fabric
sodium_min=0.9.2

lwjgl=3.4.3

# Mod properties
version=alpha-1
group=rodozodo.infinite

# Build switches
# Java release the mod is compiled for
target_java=25
# Bundle the LWJGL "unsafe" variants instead of the plain ones
lwjgl_unsafe=false
# Bundle every platform's natives instead of only the ones the mod supports
ship_all_platforms=false
